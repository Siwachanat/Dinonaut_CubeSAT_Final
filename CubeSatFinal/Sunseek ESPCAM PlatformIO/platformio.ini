; ============================================================
; SunSeek ESP32-CAM Payload Firmware v3.1 — PlatformIO project
; Target : AI Thinker ESP32-CAM (ESP32-D0WD, 4 MB flash, 4 MB PSRAM) + OV2640 + microSD
; ============================================================
;
;   pio run -e esp32cam                 build (pioarduino, Arduino-ESP32 3.3.x — same toolchain as the S3 ports)
;   pio run -e esp32cam -t upload       flash  (hold IO0 to GND while resetting, then release)
;   pio device monitor                  115200 baud
;   pio run -e esp32cam_core2           fallback build on the official espressif32 platform (Arduino-ESP32 2.0.17)
;
; The ESP32-CAM has no USB: upload through an FTDI/CP210x adapter on U0TXD (GPIO1) / U0RXD (GPIO3).
; The OBC UART must be disconnected from those two pins while flashing (same pins!).

[platformio]
default_envs = esp32cam
src_dir      = src
include_dir  = include

[env]
board           = esp32cam
framework       = arduino
monitor_speed   = 115200
upload_speed    = 460800          ; drop to 115200 if the FTDI adapter gives "Timed out waiting for packet header"
monitor_filters = esp32_exception_decoder, default
; 3 MB app / 1 MB SPIFFS, no OTA. Camera + Wi-Fi + HTTP + SD_MMC is ~1 MB and would be tight in default.csv.
board_build.partitions = huge_app.csv
board_build.f_cpu      = 240000000L
; esp32cam.json already adds -DBOARD_HAS_PSRAM -mfix-esp32-psram-cache-issue (needed for the 4 MB PSRAM
; that holds the camera frame buffers). CORE_DEBUG_LEVEL=0 keeps Arduino log output off UART0, which is
; the OBC control link — the OBC parser must only ever see protocol lines.
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DPAYLOAD_FW_VERSION=\"3.1\"

; --- primary: pioarduino (Arduino-ESP32 3.3.x, ESP-IDF 5.x). Packages hosted on GitHub. ---
[env:esp32cam]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30/platform-espressif32.zip

; --- debug: same toolchain, but every ESP-IDF / Arduino log line stays on UART0 (camera + SD init errors!) ---
; Use this when something does not come up; the OBC must NOT be connected (log lines would confuse its parser).
[env:esp32cam_debug]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30/platform-espressif32.zip
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DPAYLOAD_SILENCE_SYSTEM_LOGS=0
    -DPAYLOAD_FW_VERSION=\"3.1-debug\"

; --- fallback: official PlatformIO espressif32 6.9.0 (Arduino-ESP32 2.0.17, ESP-IDF 4.4) ---
[env:esp32cam_core2]
platform = espressif32@6.9.0
