; =====================================================================
;  SunSeek Platform Firmware v3.0 — PlatformIO port
;  Board : SunSeek competition board, ESP32-S3-WROOM-1
;  Upload: CP210x USB-UART (UART0, GPIO43/44)
;  Equivalent Arduino IDE settings: "ESP32S3 Dev Module", USB CDC On Boot =
;  Disabled, Flash 4MB, Partition "Default 4MB with spiffs", core 3.3.x
; =====================================================================
[platformio]
default_envs = sunseek

[env:sunseek]
; pioarduino = Arduino-ESP32 core 3.3.x (the code's BLE layer is written for 3.3.x).
; Official "espressif32" is stuck on core 2.0.17 — not tested with this firmware.
;platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30/platform-espressif32.zip
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board     = esp32-s3-devkitc-1
framework = arduino

board_upload.flash_size = 4MB
board_build.partitions  = default.csv     ; 1.25 MB app — firmware uses ~58 %

upload_speed    = 921600                  ; 460800 if uploads are flaky
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
monitor_eol     = LF                      ; telecommands are '\n'-framed
monitor_echo    = yes
; upload_port  = /dev/cu.usbserial-0001   ; macOS example (CP210x)
; upload_port  = COM5                     ; Windows example

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=0          ; Serial = UART0 -> CP210x
    -D CORE_DEBUG_LEVEL=1
    -Wno-deprecated-declarations          ; BLE2902 notice from NimBLE (harmless)

; No external libraries: Wire, BLE and HardwareSerial ship with the core.

; ---------------------------------------------------------------------
; Plan B if the pioarduino toolchain will not install on your machine.
; Official PlatformIO platform = Arduino-ESP32 core 2.0.17. It installs from
; the PlatformIO registry and does not use idf_tools.py.
; Build:  pio run -e sunseek_core2 -t upload -t monitor
; (or pick "env:sunseek_core2" in the PlatformIO toolbar)
; Untested on core 2.x here — the firmware's BLE code is written to accept
; both core 2.x and 3.x.
; ---------------------------------------------------------------------
[env:sunseek_core2]
extends  = env:sunseek
platform = espressif32@6.9.0
